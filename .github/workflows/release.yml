name: Release

# Every merge (push) to main:
#   1. derives the next semantic version from the commit messages since the
#      last tag (scripts/next-version.sh – Conventional Commits: fix → patch,
#      feat → minor, "BREAKING CHANGE" / "feat!:" → major, anything else →
#      patch; the very first release is 1.0.0; no new commits → no release),
#   2. builds QodeNotch.app, signs it with the Developer ID certificate and
#      notarizes it (falls back to ad-hoc signing while the secrets are missing),
#   3. tags the commit (vX.Y.Z) and publishes a GitHub Release with the ZIP –
#      downloadable without a GitHub account.
#
# Secrets for a signed, notarized build (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE_P12      base64 of the exported "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD password of that .p12
#   MACOS_SIGN_IDENTITY        e.g. "Developer ID Application: Jane Doe (AB12CD34EF)"
#   NOTARY_KEY_P8              base64 of the App Store Connect API key (AuthKey_XXXX.p8)
#   NOTARY_KEY_ID              its key id
#   NOTARY_ISSUER_ID           its issuer id

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          ./scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"
          {
            echo "changelog<<EOF_CHANGELOG"
            cat build/CHANGELOG.md
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.version.outputs.bump == 'none'
        run: echo "::notice::No commits since v${{ steps.version.outputs.previous }} – no release."

      - name: Test core
        if: steps.version.outputs.bump != 'none'
        run: swift test

      - name: Import signing certificate
        if: steps.version.outputs.bump != 'none'
        id: cert
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::No signing certificate configured – building an ad-hoc signed app."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        if: steps.version.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.signed == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: ./scripts/build-app.sh

      - name: Notarize
        if: steps.version.outputs.bump != 'none' && (steps.cert.outputs.signed == 'true')
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$NOTARY_KEY_P8" ]; then
            echo "::warning::No notarization key configured – the app is signed but not notarized."
            exit 0
          fi
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH"
          ./scripts/notarize.sh "build/QodeNotch-${{ steps.version.outputs.version }}.zip"
          rm -f "$NOTARY_KEY_PATH"

      - name: Package
        if: steps.version.outputs.bump != 'none'
        run: |
          ZIP="build/QodeNotch-${{ steps.version.outputs.version }}.zip"
          [ -f "$ZIP" ] || ditto -c -k --keepParent build/QodeNotch.app "$ZIP"

      - name: Release notes
        if: steps.version.outputs.bump != 'none'
        id: notes
        env:
          CHANGELOG: ${{ steps.version.outputs.changelog }}
          SIGNED: ${{ steps.cert.outputs.signed }}
        run: |
          {
            echo "body<<EOF_NOTES"
            echo "$CHANGELOG"
            echo
            echo "### Installation"
            echo "ZIP entpacken und \`QodeNotch.app\` in den Ordner *Programme* ziehen."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "Dieser Build ist nur ad-hoc signiert. Vor dem ersten Start einmal ausführen:"
              echo '```bash'
              echo 'xattr -dr com.apple.quarantine /Applications/QodeNotch.app'
              echo '```'
            fi
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.version.outputs.bump != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: QodeNotch ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: build/QodeNotch-${{ steps.version.outputs.version }}.zip

      - name: Clean up keychain
        if: steps.version.outputs.bump != 'none' && (always() && steps.cert.outputs.signed == 'true')
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
