name: Release

# Builds QodeNotch.app and publishes it as a GitHub Release, which – unlike
# workflow artifacts – anyone can download without a GitHub account.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# or run it manually (Actions → Release → Run workflow) with a version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 (creates tag v<version>)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Test core
        run: swift test
      - name: Build app bundle
        run: VERSION=${{ steps.v.outputs.version }} ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent QodeNotch.app QodeNotch-${{ steps.v.outputs.version }}.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: QodeNotch ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: build/QodeNotch-${{ steps.v.outputs.version }}.zip
          body: |
            **Installation:** ZIP entpacken, `QodeNotch.app` nach `/Programme` ziehen und einmal ausführen:

            ```bash
            xattr -dr com.apple.quarantine /Applications/QodeNotch.app
            ```

            Die App ist nur ad-hoc signiert (nicht notarisiert), daher blockiert Gatekeeper sie sonst beim ersten Start.
