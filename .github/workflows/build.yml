name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Test core
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent QodeNotch.app QodeNotch.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QodeNotch
          path: build/QodeNotch.zip

  linux-core:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install procps
        run: apt-get update -qq && apt-get install -y -qq procps
      - name: Test core
        run: swift test
